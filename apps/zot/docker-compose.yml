services:
  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:latest
    container_name: zot
    ports:
      - "5000:5000"
    volumes:
      - ./config/config.json:/etc/zot/config.json:ro
      - ./data:/var/lib/zot
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/v2/_catalog"]
      interval: 30s
      timeout: 10s
      retries: 3
