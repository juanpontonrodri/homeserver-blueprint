services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"      # Port for the Portainer web interface
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Allows Portainer to interact with Docker
      - ./data:/data                              # Stores Portainer configuration
