version: "3.8"

services:
  tdarr:
    image: haveagitgat/tdarr:latest
    container_name: tdarr
    ports:
      - "8265:8265" # WebUI
      - "8266:8266" # Server port
    devices:
      - /dev/dri:/dev/dri # HW acceleration
    volumes:
      - /media:/media
      - ./app/server/configs:/app/server/configs
      - ./app/server/Tdarr:/app/server/Tdarr
      - ./app/server/logs:/app/server/logs
      - ./app/configs:/app/configs
      - ./logs:/app/server/logs
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - LIBVA_DRIVER_NAME=iHD # Intel VA-API
    restart: unless-stopped

  tdarr-node:
    image: haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    depends_on:
      - tdarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - serverIP=tdarr
      - serverPort=8266
      - nodeName=InternalNode
    devices:
      - /dev/dri:/dev/dri # HW acceleration
    volumes:
      - /media:/media
      - ./node/configs:/app/configs
      - ./node/logs:/app/logs
    restart: unless-stopped
